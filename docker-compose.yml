# Run everything with: docker-compose up --build

# Services:
#   calendar-mcp  — TypeScript MCP server  → port 3001
#   whatsapp-mcp  — Python MCP server  → port 3002
#   health-mcp    — Python MCP server  → port 3003
#   orchestrator  — Python FastAPI  → port 8000
#   ml-engine     — Python pattern engine → port 8001
#
# The frontend (React Native / Expo) runs on local machine with
# `npm start` inside /frontend. It is NOT containerized.

services:

  # Calendar MCP Server 
  calendar-mcp:
    build: ./mcp-servers/calendar
    user: "1000:1000"
    command: ["node", "build/index.js", "start", "--transport", "http", "--host", "0.0.0.0", "--port", "3001"]
    ports:
      - "3001:3001"
    volumes:
      - ./gcp-oauth.keys.json:/app/gcp-oauth.keys.json
      - /home/ezekiel/.config/google-calendar-mcp/tokens.json:/home/node/.config/google-calendar-mcp/tokens.json
    networks:
      - contextmirror-net

  # WhatsApp MCP Server 
  whatsapp-mcp:
    build: ./mcp-servers/whatsapp
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
    volumes:
      - whatsapp_data:/app/data   # WhatsApp SQLite DB lives here
    networks:
      - contextmirror-net

  # Health MCP Server 
  health-mcp:
    build: ./mcp-servers/health
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
    volumes:
      - ./mcp-servers/health/applehealth.duckdb:/root_project/applehealth.duckdb # Uploaded Apple Health XML / CSV lives here
    networks:
      - contextmirror-net

  # Orchestrator 
  # The "brain" MCP client that calls all 3 servers, runs the RAG pipeline,
  # and exposes a REST API to the frontend.
  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    environment:
      - CALENDAR_MCP_URL=http://calendar-mcp:3001
      - WHATSAPP_MCP_URL=http://whatsapp-mcp:3002
      - HEALTH_MCP_URL=http://health-mcp:3003
      - DATABASE_URL=sqlite:///./data/contextmirror.db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      - orchestrator_data:/app/data
    depends_on:
      - calendar-mcp
      - whatsapp-mcp
      - health-mcp
    networks:
      - contextmirror-net

  # ML Engine
  ml-engine:
    build: ./ml-engine
    ports:
      - "8001:8001"
    networks:
      - contextmirror-net

networks:
  contextmirror-net:
    driver: bridge

volumes:
  whatsapp_data:
  health_data:
  orchestrator_data:
  ml_models:
